name: Siyuan Queue Production All-Scope Cutover (Manual)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed siyuan-crm main SHA descended from the authorized base
        required: true
        type: string
      confirmation:
        description: Exact all-scope production authorization phrase from the Siyuan manifest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: siyuan-production-queue-cutover
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      authorization_base_sha: ${{ steps.manifest.outputs.authorization_base_sha }}
      target_policy_version: ${{ steps.manifest.outputs.target_policy_version }}
    steps:
      - name: Checkout requested release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify immutable Siyuan authorization envelope and deployed successor
        id: manifest
        env:
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
        run: |
          set -e
          set -o pipefail
          test "$GITHUB_REPOSITORY" = 'qianlan333/siyuan-crm'
          test "$PUBLIC_HEALTH_URL" = 'https://www.xinliushangye.com/health'
          release_sha='${{ inputs.release_sha }}'
          manifest='docs/releases/siyuan_queue_all_scope_cutover.json'
          authorization_base_sha="$(python3 -c 'import json; print(json.load(open("docs/releases/siyuan_queue_all_scope_cutover.json", encoding="utf-8"))["authorization_base_sha"])')"
          target_policy_version="$(python3 -c 'import json; print(json.load(open("docs/releases/siyuan_queue_all_scope_cutover.json", encoding="utf-8"))["target_policy_version"])')"
          test "$(git rev-parse HEAD)" = "$release_sha"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$release_sha"
          git merge-base --is-ancestor "$authorization_base_sha" "$release_sha"
          git diff --name-only "$authorization_base_sha..$release_sha" > /tmp/siyuan-queue-cutover-changed-paths.txt
          python3 scripts/ops/validate_queue_all_scope_cutover.py \
            --manifest "$manifest" \
            --release-sha "$release_sha" \
            --authorization-base-sha "$authorization_base_sha" \
            --confirmation '${{ inputs.confirmation }}' \
            --changed-paths /tmp/siyuan-queue-cutover-changed-paths.txt
          curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -sSf \
            -D /tmp/siyuan-queue-cutover-health.headers \
            "$PUBLIC_HEALTH_URL" \
            -o /tmp/siyuan-queue-cutover-health.json
          public_sha="$(awk 'tolower($1) == "x-aicrm-release-sha:" {gsub("\\r", "", $2); print $2}' /tmp/siyuan-queue-cutover-health.headers)"
          test "$public_sha" = "$release_sha"
          echo "authorization_base_sha=$authorization_base_sha" >> "$GITHUB_OUTPUT"
          echo "target_policy_version=$target_policy_version" >> "$GITHUB_OUTPUT"

  cutover:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Activate generation 1, transition all scope, and start 72-hour soak
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            set -o pipefail
            cd '/home/ubuntu/极简 crm'
            release_sha='${{ inputs.release_sha }}'
            authorization_base_sha='${{ needs.validate.outputs.authorization_base_sha }}'
            target_policy_version='${{ needs.validate.outputs.target_policy_version }}'
            test "$(git rev-parse HEAD)" = "$release_sha"
            test "$(tr -d '\r\n' < .release-sha)" = "$release_sha"
            set -a
            source /home/ubuntu/.openclaw-wecom-pg.env
            set +a
            source /home/ubuntu/venvs/openclaw/bin/activate
            python3 -m alembic current | grep -F '0158_ai_assistant_item_pipeline'
            python3 scripts/ops/check_queue_runtime_invariants.py \
              > /tmp/siyuan-queue-invariants-before.json
            python3 -c 'import json; data=json.load(open("/tmp/siyuan-queue-invariants-before.json")); assert data["ok"] is True; assert data["read_only"] is True'

            export AICRM_QUEUE_ALL_SCOPE_RECOVERY_AUTHORIZED=1
            python3 scripts/ops/recover_all_scope_contact_detail.py \
              --action prepare \
              --authorization-base-sha "$authorization_base_sha" \
              --confirmation '${{ inputs.confirmation }}' \
              --actor github-actions \
              --reason 'authorized Siyuan production all-scope exact contact-detail type' \
              --apply \
              > /tmp/siyuan-contact-detail-prepare.json
            python3 -c 'import json; data=json.load(open("/tmp/siyuan-contact-detail-prepare.json")); assert data["after"]["contact_detail_enabled"] is True; assert data["real_external_call_executed"] is False'

            python3 scripts/ops/transition_queue_runtime_scope.py \
              --generation 1 \
              --expected-policy-version queue-v2-test-loopback \
              --target-policy-version "$target_policy_version" \
              --expected-scope test_loopback \
              --target-scope all \
              --authorization-base-sha "$authorization_base_sha" \
              --actor github-actions \
              --reason 'authorized Siyuan production all-scope cutover preflight' \
              > /tmp/siyuan-queue-all-scope-preflight.json
            python3 -c 'import json; data=json.load(open("/tmp/siyuan-queue-all-scope-preflight.json")); assert data["policy_preflight"]["ready"] is True'

            export AICRM_QUEUE_CUTOVER_AUTHORIZED=1
            python3 scripts/ops/cutover_queue_runtime_generation.py \
              --expected-generation 0 \
              --target-generation 1 \
              --expected-policy-version queue-v2-test-loopback \
              --accepted-target-policy-version "$target_policy_version" \
              --lane ai_generation \
              --lane internal_general \
              --lane internal_financial \
              --lane webhook_inbox \
              --lane wecom_welcome_ingress \
              --lane wecom_welcome \
              --lane wecom_interactive \
              --lane wecom_bulk \
              --lane wecom_ai_assistant_bulk \
              --lane wecom_media \
              --lane outbound_webhook \
              --owner-inventory pr3 \
              --actor github-actions \
              --reason 'authorized Siyuan production generation 1 owner cutover' \
              --ensure-owner-state \
              --confirmation ACTIVATE_QUEUE_GENERATION_1 \
              > /tmp/siyuan-queue-generation-owner.json
            python3 -c 'import json; data=json.load(open("/tmp/siyuan-queue-generation-owner.json")); assert data["active_generation"] == 1; assert data["claim_enabled"] is True; assert data["real_external_call_executed"] is False'

            export AICRM_QUEUE_SCOPE_TRANSITION_AUTHORIZED=1
            export AICRM_QUEUE_ALL_SCOPE_AUTHORIZED=1
            python3 scripts/ops/transition_queue_runtime_scope.py \
              --generation 1 \
              --expected-policy-version queue-v2-test-loopback \
              --target-policy-version "$target_policy_version" \
              --expected-scope test_loopback \
              --target-scope all \
              --authorization-base-sha "$authorization_base_sha" \
              --all-scope-confirmation '${{ inputs.confirmation }}' \
              --actor github-actions \
              --reason 'authorized Siyuan production all-scope queue ownership' \
              --apply \
              --confirmation TRANSITION_QUEUE_SCOPE_1_TEST_LOOPBACK_TO_ALL

            python3 scripts/ops/recover_all_scope_contact_detail.py \
              --action recover \
              --authorization-base-sha "$authorization_base_sha" \
              --confirmation '${{ inputs.confirmation }}' \
              --actor github-actions \
              --reason 'recover bounded Siyuan pre-provider contact-detail gate blocks' \
              --maximum-candidate-count 50 \
              --wait-timeout-seconds 180 \
              --apply \
              > /tmp/siyuan-contact-detail-recovery.json
            python3 - <<'PY'
            import json

            data = json.load(open('/tmp/siyuan-contact-detail-recovery.json', encoding='utf-8'))
            assert 0 <= data['candidate_count'] <= 50
            assert sum(data['candidate_attempt_histogram'].values()) == data['candidate_count']
            assert data['contains_raw_target_or_job_ids'] is False
            assert data['progress']['duplicate_provider_attempt_job_count'] == 0
            assert data['progress']['unsafe_terminal_count'] == 0
            PY

            python3 scripts/ops/cutover_queue_runtime_generation.py \
              --expected-generation 0 \
              --target-generation 1 \
              --expected-policy-version "$target_policy_version" \
              --lane internal_general \
              --owner-inventory pr3 \
              --actor github-actions \
              --reason 'verify Siyuan production queue single ownership' \
              --verify-owner-state \
              > /tmp/siyuan-queue-owner-verified.json

            python3 - "$release_sha" "$target_policy_version" <<'PY'
            import json
            import sys
            import time
            from urllib.request import urlopen

            deadline = time.monotonic() + 120
            consecutive_idle = 0
            while time.monotonic() < deadline:
                with urlopen('http://127.0.0.1:5001/api/system/health', timeout=10) as response:
                    data = json.load(response)
                queue = data['components']['queues']['metrics']
                assert data['status'] == 'ready'
                assert not data['failed_components']
                assert data['components']['release']['release_sha'] == sys.argv[1]
                assert queue['queue_active_generation'] == 1
                assert queue['queue_policy_version'] == sys.argv[2]
                assert queue['queue_external_claim_scope'] == 'all'
                if queue['queue_eligible_count'] == 0 and queue['queue_in_flight_count'] == 0:
                    consecutive_idle += 1
                    if consecutive_idle >= 3:
                        break
                else:
                    consecutive_idle = 0
                time.sleep(2)
            else:
                raise RuntimeError('Siyuan production queue did not remain idle for three bounded samples')
            PY

            python3 scripts/ops/check_queue_runtime_invariants.py \
              > /tmp/siyuan-queue-invariants-after.json
            python3 -c 'import json; data=json.load(open("/tmp/siyuan-queue-invariants-after.json")); assert data["ok"] is True; assert data["read_only"] is True'

            export AICRM_QUEUE_SOAK_AUTHORIZED=1
            python3 scripts/ops/manage_queue_runtime_soak.py \
              --action start \
              --expected-release-sha "$release_sha" \
              --generation 1 \
              --expected-policy-version "$target_policy_version" \
              --expected-scope all \
              --duration-hours 72 \
              --actor github-actions \
              --reason 'Siyuan production all-scope 72-hour observation' \
              --confirmation "START_QUEUE_SOAK_${release_sha}_1"
            sudo systemctl start aicrm-queue-soak-snapshot.service
            sudo systemctl is-active --quiet aicrm-queue-soak-snapshot.timer
