name: Internal Worker Observer Production Diagnostics (Read Only)

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact release SHA currently exposed by production
        required: true
        type: string
      confirmation:
        description: Exact read-only diagnostics confirmation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aicrm-production-internal-worker-observer-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify public release and confirmation
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -e
          test "$CONFIRMATION" = 'DIAGNOSE AI-CRM INTERNAL WORKER OBSERVER READ ONLY'
          printf '%s' "$EXPECTED_RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          curl -sSf -D /tmp/aicrm-internal-worker-observer-health.headers \
            https://www.youcangogogo.com/health \
            -o /tmp/aicrm-internal-worker-observer-health.json
          public_sha="$(awk 'tolower($1) == "x-aicrm-release-sha:" {gsub("\\r", "", $2); print $2}' /tmp/aicrm-internal-worker-observer-health.headers)"
          test "$public_sha" = "$EXPECTED_RELEASE_SHA"

      - name: Read observer and predecessor parity evidence
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          envs: EXPECTED_RELEASE_SHA
          script: |
            set -e
            set -o pipefail
            cd '/home/ubuntu/极简 crm'
            test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
            test "$(tr -d '\r\n' < .release-sha)" = "$EXPECTED_RELEASE_SHA"

            observer_unit='aicrm-internal-worker-observer.service'
            systemctl is-enabled --quiet "$observer_unit"
            systemctl is-active --quiet "$observer_unit"
            for predecessor in \
              aicrm-internal-queue-runtime.service \
              aicrm-inbox-queue-runtime.service
            do
              systemctl is-enabled --quiet "$predecessor"
              systemctl is-active --quiet "$predecessor"
            done

            observer_exec="$(systemctl show "$observer_unit" --property=ExecStart --value)"
            printf 'observer_exec_contract=%s\n' "$observer_exec"
            case "$observer_exec" in
              *'run_execution_runtime.py --role internal_worker --standby'*) ;;
              *) echo 'observer is not using the reviewed claimless role command'; exit 1 ;;
            esac
            case "$observer_exec" in
              *'--execute'*) echo 'observer unexpectedly enables execution'; exit 1 ;;
              *) ;;
            esac

            set -a
            source /home/ubuntu/.openclaw-wecom-pg.env
            set +a
            source /home/ubuntu/venvs/openclaw/bin/activate
            python3 - <<'PY'
            import json

            from sqlalchemy import text

            from aicrm_next.shared.db_session import get_session_factory


            expected_counts = {
                "aicrm-internal_event-runtime": 2,
                "aicrm-internal_outbox-runtime": 2,
                "aicrm-webhook_inbox-runtime": 2,
            }
            with get_session_factory()() as session:
                control = dict(
                    session.execute(
                        text(
                            """
                            SELECT active_generation, claim_enabled, rollout_mode
                            FROM queue_runtime_control
                            WHERE singleton = TRUE
                            """
                        )
                    ).mappings().one()
                )
                observer_rows = [
                    dict(row)
                    for row in session.execute(
                        text(
                            """
                            SELECT service_name, queue_kind, generation, rollout_mode,
                                   COUNT(*) AS heartbeat_count,
                                   BOOL_AND(listener_connected) AS listeners_connected,
                                   MAX(EXTRACT(EPOCH FROM (
                                       CURRENT_TIMESTAMP - heartbeat_at
                                   )))::BIGINT AS oldest_heartbeat_age_seconds
                            FROM queue_worker_heartbeat
                            WHERE worker_id LIKE '%:role:internal_worker:%'
                              AND heartbeat_at >= CURRENT_TIMESTAMP - INTERVAL '45 seconds'
                            GROUP BY service_name, queue_kind, generation, rollout_mode
                            ORDER BY service_name
                            """
                        )
                    ).mappings()
                ]
                predecessor_rows = [
                    dict(row)
                    for row in session.execute(
                        text(
                            """
                            SELECT service_name, queue_kind, generation, rollout_mode,
                                   COUNT(*) AS heartbeat_count,
                                   BOOL_AND(listener_connected) AS listeners_connected,
                                   MAX(EXTRACT(EPOCH FROM (
                                       CURRENT_TIMESTAMP - heartbeat_at
                                   )))::BIGINT AS oldest_heartbeat_age_seconds
                            FROM queue_worker_heartbeat
                            WHERE worker_id NOT LIKE '%:role:internal_worker:%'
                              AND service_name = ANY(:service_names)
                              AND heartbeat_at >= CURRENT_TIMESTAMP - INTERVAL '45 seconds'
                            GROUP BY service_name, queue_kind, generation, rollout_mode
                            ORDER BY service_name
                            """
                        ),
                        {"service_names": list(expected_counts)},
                    ).mappings()
                ]
                active_role_claims = [
                    dict(row)
                    for row in session.execute(
                        text(
                            """
                            SELECT queue_kind, COUNT(*)::BIGINT AS row_count
                            FROM (
                                SELECT 'internal_event'::TEXT AS queue_kind
                                FROM internal_event_consumer_run
                                WHERE status = 'running'
                                  AND locked_by LIKE '%:role:internal_worker:%'
                                UNION ALL
                                SELECT 'internal_outbox'
                                FROM internal_event_outbox
                                WHERE status = 'running'
                                  AND locked_by LIKE '%:role:internal_worker:%'
                                UNION ALL
                                SELECT 'webhook_inbox'
                                FROM webhook_inbox
                                WHERE status = 'processing'
                                  AND locked_by LIKE '%:role:internal_worker:%'
                            ) claimed
                            GROUP BY queue_kind
                            ORDER BY queue_kind
                            """
                        )
                    ).mappings()
                ]

            active_generation = int(control["active_generation"])
            assert active_generation > 0
            observer_counts = {
                str(row["service_name"]): int(row["heartbeat_count"])
                for row in observer_rows
            }
            assert observer_counts == expected_counts
            assert all(int(row["generation"]) == active_generation for row in observer_rows)
            assert all(row["rollout_mode"] == "standby" for row in observer_rows)
            assert all(row["listeners_connected"] is True for row in observer_rows)
            predecessor_names = {str(row["service_name"]) for row in predecessor_rows}
            assert predecessor_names == set(expected_counts)
            assert all(int(row["generation"]) == active_generation for row in predecessor_rows)
            assert all(
                row["rollout_mode"] in {"canary", "execute"}
                for row in predecessor_rows
            )
            assert all(row["listeners_connected"] is True for row in predecessor_rows)
            assert active_role_claims == []

            print(
                json.dumps(
                    {
                        "runtime_control": control,
                        "observer_heartbeat_groups": observer_rows,
                        "predecessor_heartbeat_groups": predecessor_rows,
                        "active_role_claims": active_role_claims,
                        "observer_claimless": True,
                        "predecessors_authoritative": True,
                        "target_values_redacted": True,
                        "real_external_call_executed": False,
                        "read_only": True,
                    },
                    ensure_ascii=False,
                    sort_keys=True,
                    default=str,
                )
            )
            PY
