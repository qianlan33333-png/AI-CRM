name: CI Fast

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: "Force full regression outside budgeted CI"
        required: false
        default: "false"

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.scope.outputs.changed_files }}
      scopes: ${{ steps.scope.outputs.scopes }}
      python_tests: ${{ steps.scope.outputs.python_tests }}
      frontend_tests: ${{ steps.scope.outputs.frontend_tests }}
      needs_postgres: ${{ steps.scope.outputs.needs_postgres }}
      needs_dependency_audit: ${{ steps.scope.outputs.needs_dependency_audit }}
      needs_full_ci: ${{ steps.scope.outputs.needs_full_ci }}
      force_full: ${{ steps.scope.outputs.force_full }}
      architecture_gate: ${{ steps.scope.outputs.architecture_gate }}
      ci_tier: ${{ steps.scope.outputs.ci_tier }}
      estimated_python_work_seconds: ${{ steps.scope.outputs.estimated_python_work_seconds }}
      budget_exceeded: ${{ steps.scope.outputs.budget_exceeded }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          fetch-depth: 0

      - name: Select budgeted test scope
        id: scope
        run: >-
          python scripts/ci/select_test_scope.py
          --github-output "$GITHUB_OUTPUT"
          --enforce-budget

      - name: Compare convention selector in shadow mode
        continue-on-error: true
        run: >-
          python scripts/ci/select_test_scope_v2.py
          --json-output "$RUNNER_TEMP/test-scope-v2-shadow.json"
          --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload selector shadow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: test-scope-v2-shadow
          path: ${{ runner.temp }}/test-scope-v2-shadow.json
          if-no-files-found: warn
          retention-days: 30

  scoped-validation:
    needs: select
    if: >-
      needs.select.outputs.force_full != 'true' &&
      (needs.select.outputs.architecture_gate != 'none' ||
       needs.select.outputs.python_tests != '' ||
       needs.select.outputs.frontend_tests != '' ||
       needs.select.outputs.needs_dependency_audit == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          fetch-depth: 0

      - name: Setup Python
        if: >-
          needs.select.outputs.architecture_gate != 'none' ||
          needs.select.outputs.python_tests != '' ||
          needs.select.outputs.needs_dependency_audit == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (Node 24)
        with:
          python-version: "3.10.5"

      - name: Restore hashed Python environment
        id: python-venv-cache
        if: >-
          needs.select.outputs.architecture_gate != 'none' ||
          needs.select.outputs.python_tests != '' ||
          needs.select.outputs.needs_dependency_audit == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-v1-${{ runner.os }}-${{ runner.arch }}-py3.10.5-${{ hashFiles('requirements.lock') }}

      - name: Install dependencies on cache miss
        if: >-
          steps.python-venv-cache.outputs.cache-hit != 'true' &&
          (needs.select.outputs.architecture_gate != 'none' ||
           needs.select.outputs.python_tests != '' ||
           needs.select.outputs.needs_dependency_audit == 'true')
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock

      - name: Activate hashed Python environment
        if: >-
          needs.select.outputs.architecture_gate != 'none' ||
          needs.select.outputs.python_tests != '' ||
          needs.select.outputs.needs_dependency_audit == 'true'
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run selected architecture gates
        if: needs.select.outputs.architecture_gate != 'none'
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AICRM_PYTEST_FIXTURE_DEFAULT: "1"
        run: bash scripts/ci/run_architecture_gates.sh --mode "${{ needs.select.outputs.architecture_gate }}"

      - name: Run scoped Python tests without PostgreSQL
        if: needs.select.outputs.python_tests != '' && needs.select.outputs.needs_postgres != 'true'
        env:
          PYTHON_TESTS: ${{ needs.select.outputs.python_tests }}
        run: python -m pytest ${PYTHON_TESTS} -n auto --dist=loadfile -q --tb=short

      - name: Run scoped PostgreSQL Python tests
        if: needs.select.outputs.python_tests != '' && needs.select.outputs.needs_postgres == 'true'
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AICRM_PYTEST_FIXTURE_DEFAULT: "1"
          PYTHON_TESTS: ${{ needs.select.outputs.python_tests }}
        run: >-
          python -m pytest ${PYTHON_TESTS} -n auto --dist=loadfile -q --tb=short
          --timeout=120 --timeout-method=thread

      - name: Setup Node
        if: needs.select.outputs.frontend_tests != '' || needs.select.outputs.needs_dependency_audit == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (Node 24)
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        if: needs.select.outputs.frontend_tests != '' || needs.select.outputs.needs_dependency_audit == 'true'
        run: npm ci

      - name: Run scoped frontend tests
        if: needs.select.outputs.frontend_tests != ''
        env:
          FRONTEND_TESTS: ${{ needs.select.outputs.frontend_tests }}
        run: |
          for test_file in ${FRONTEND_TESTS}; do
            node "$test_file"
          done

      - name: Validate dependency governance
        if: needs.select.outputs.needs_dependency_audit == 'true'
        run: python scripts/ci/check_dependency_security.py

      - name: Audit Python dependencies
        if: needs.select.outputs.needs_dependency_audit == 'true'
        run: python -m pip_audit -r requirements.lock --require-hashes --progress-spinner=off

      - name: Audit Node dependencies
        if: needs.select.outputs.needs_dependency_audit == 'true'
        run: npm audit --audit-level=high

  full-regression:
    needs: select
    if: needs.select.outputs.force_full == 'true'
    uses: ./.github/workflows/full-regression.yml
    with:
      run_governance: true

  ci-fast-result:
    needs:
      - select
      - scoped-validation
      - full-regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Required check result
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          SCOPES: ${{ needs.select.outputs.scopes }}
          CI_TIER: ${{ needs.select.outputs.ci_tier }}
          FORCE_FULL: ${{ needs.select.outputs.force_full }}
          ESTIMATED_PYTHON_WORK_SECONDS: ${{ needs.select.outputs.estimated_python_work_seconds }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = [
              f"{name}={job['result']}"
              for name, job in needs.items()
              if job["result"] not in {"success", "skipped"}
          ]
          if (
              os.environ.get("FORCE_FULL") == "true"
              and needs.get("full-regression", {}).get("result") != "success"
              and not any(item.startswith("full-regression=") for item in failed)
          ):
              failed.append(f"full-regression={needs.get('full-regression', {}).get('result', 'missing')}_but_required")
          print(f"selected_scopes={os.environ.get('SCOPES') or 'none'}")
          print(f"ci_tier={os.environ.get('CI_TIER') or 'unknown'}")
          print(f"estimated_python_work_seconds={os.environ.get('ESTIMATED_PYTHON_WORK_SECONDS') or '0'}")
          if failed:
              print("Budgeted CI failed: " + ", ".join(failed))
              sys.exit(1)
          PY
