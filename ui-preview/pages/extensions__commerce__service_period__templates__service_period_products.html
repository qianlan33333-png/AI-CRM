  .service-period-table { min-width: 1040px; }

  .service-period-muted,
  .service-period-toast,
  .service-period-sub {

  .service-period-toast {
    min-height: 22px;
    font-weight: 700;
  }
  .service-period-sub {
    margin-top: 4px;
    font-size: 12px;
    line-height: 1.6;
  }
  .service-period-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 26px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #f5f6f7;
    color: #667085;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }
  .service-period-pill.active,
  .service-period-pill.ok {
    color: var(--ok);
    background: #e6faf5;
  }
  .service-period-pill.warn {
    color: var(--warn);
    background: #fff3e0;
  }
  .service-period-pill.disabled,
  .service-period-pill.draft,
  .service-period-pill.off,
  .service-period-pill.gray {

    background: #f5f6f7;
  }
  .service-period-editor {
    min-width: 1180px;
    margin: -20px -28px -40px;
    padding: 20px 28px 40px;
    background: var(--bg);
  }
  .service-period-summary-card {
    display: grid;
    gap: 16px;
    margin-bottom: 18px;
  }
  .service-period-summary-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .service-period-summary-title {
    display: grid;
    gap: 4px;
    min-width: 0;
  }
  .service-period-summary-title h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 900;
    overflow-wrap: anywhere;
  }
  .service-period-summary-grid,
  .service-period-stats-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  .service-period-mini {
    min-height: 80px;
    padding: 15px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
  }
  .service-period-mini .label {
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  .service-period-mini .value {
    color: var(--text);
    font-size: 22px;
    font-weight: 900;
    overflow-wrap: anywhere;
  }
  .service-period-workspace {
    display: grid;
    grid-template-columns: 196px minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }
  .service-period-side-nav {
    position: sticky;
    top: 84px;
    padding: 10px;
  }
  .service-period-side-nav button {
    width: 100%;
    min-height: 56px;
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 10px;
    align-items: center;
    border: 0;
    border-radius: 12px;
    background: #fff;
    color: #4e5969;
    cursor: pointer;
    text-align: left;
    font: inherit;
    font-weight: 900;
    padding: 10px 12px;
  }
  .service-period-side-nav button + button { margin-top: 8px; }
  .service-period-side-nav button.active {
    color: var(--brand);
    background: var(--brand-soft);
  }
  .service-period-index {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: #eef2f7;
    color: #667085;
    font-weight: 900;
  }
  .service-period-side-nav button.active .service-period-index {
    color: #fff;
    background: var(--brand);
  }
  .service-period-panel { display: none; padding: 24px; min-height: 410px; }
  .service-period-panel.active { display: block; }
  .service-period-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    margin-bottom: 20px;
    border-bottom: 1px solid #f0f1f2;
  }
  .service-period-panel-head h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 900;
  }
  .service-period-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .service-period-field {
    display: grid;
    gap: 8px;
  }
  .service-period-field.full { grid-column: 1 / -1; }
  .service-period-field label {
    color: #667085;
    font-size: 13px;
    font-weight: 800;
  }
  .service-period-field input,
  .service-period-field select,
  .service-period-field textarea {
    width: 100%;
    min-height: 42px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    font: inherit;
    padding: 10px 12px;
    outline: none;
  }
  .service-period-field textarea { min-height: 110px; resize: vertical; }
  .service-period-field input:focus,
  .service-period-field select:focus,
  .service-period-field textarea:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(51, 112, 255, 0.12);
  }
  .service-period-panel-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #f0f1f2;
  }
  .service-period-upload-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 18px;
    align-items: center;
    margin-bottom: 16px;
    padding: 18px;
    border: 1px dashed #d7dbe0;
    border-radius: 12px;
    background: #fff;
  }
  .service-period-slices,
  .service-period-param-list {
    display: grid;
    gap: 10px;
  }
  .service-period-slice,
  .service-period-param-row {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 14px 16px;
    border: 1px solid #f0f1f2;
    border-radius: 12px;
    background: #fff;
  }
  .service-period-param-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
  .service-period-drag {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fafbfc;
    color: #667085;
    cursor: grab;
    font-weight: 900;
  }
  .service-period-empty {
    min-height: 96px;
    display: grid;
    place-items: center;
    padding: 24px;
    border: 1px dashed #d7dbe0;
    border-radius: 12px;
    background: #fafbfc;
    color: var(--muted);
    font-weight: 800;
  }
  .service-period-switch-line {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    font-weight: 900;
    white-space: nowrap;
  }
  .service-period-switch {
    position: relative;
    width: 48px;
    height: 28px;
    border: 0;
    border-radius: 999px;
    background: #d0d5dd;
    cursor: pointer;
  }
  .service-period-switch::after {
    content: "";
    position: absolute;
    top: 4px;
    left: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .24);
    transition: transform .18s;
  }
  .service-period-switch[aria-checked="true"] { background: var(--brand); }
  .service-period-switch[aria-checked="true"]::after { transform: translateX(20px); }
  .service-period-panel-body[hidden],
  [data-h5-url-fields][hidden],
  [data-url-link-fields][hidden],
  .service-period-target-body[hidden] {

    font-size: 18px;

    gap: 18px;
    padding: 18px;

  .service-period-share-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
  }
  .service-period-share-input {
    min-width: 0;
    height: 42px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    padding: 0 12px;

    width: 220px;
    height: 220px;
    justify-self: center;

    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    padding: 12px;
  }
  @media (max-width: 980px) {
    .service-period-editor { min-width: 0; margin: -20px -28px -40px; }
    .service-period-summary-head,

    .service-period-product-card { flex-direction: column; grid-template-columns: 1fr; align-items: stretch; }

    .service-period-stats-grid,
    .service-period-workspace,
    .service-period-form-grid,
    .service-period-option-grid,
    .service-period-param-row { grid-template-columns: 1fr; }
    .service-period-side-nav { position: static; }
