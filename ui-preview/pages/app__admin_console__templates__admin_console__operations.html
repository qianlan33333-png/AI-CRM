<script>
(() => {
  function bindOperationOwnerPickers() {
    const picker = window.OperationMemberPicker;
    const labelOf = (member) => picker && picker.memberLabel ? picker.memberLabel(member) : (member.user_id || "");
    document.querySelectorAll("[data-operation-owner-picker]").forEach((button) => {
      button.addEventListener("click", () => {
        if (!window.OperationMemberPicker) return;
        const field = button.closest("[data-operation-owner-field]");
        const input = field ? field.querySelector("[data-operation-owner-input]") : null;
        const label = field ? field.querySelector("[data-operation-owner-label]") : null;
        window.OperationMemberPicker.open({
          value: input ? input.value : "",
          title: "选择运营人员",
          onSelect: (member) => {
            if (input) input.value = member.user_id || "";
            if (label) label.textContent = labelOf(member);
          },
        });
      });
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bindOperationOwnerPickers);
  else bindOperationOwnerPickers();
})();
</script>
