[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = [".venv", "node_modules", "test-results"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
pretty = true
show_error_codes = true
exclude = "^(\\.venv|node_modules|test-results)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: isolated logic with no PostgreSQL or external process dependency",
    "contract: current API, ownership, architecture, and manifest contracts",
    "postgres: requires the migrated PostgreSQL test schema",
    "high_risk: protects an approved high-risk business or delivery boundary",
    "release: exact-SHA startup, migration head, health, and delivery contracts",
]
